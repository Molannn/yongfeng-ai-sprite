<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>永豐AI精靈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f4f3ef;color:#0b0b0b;font-family:'Noto Sans TC',system-ui,sans-serif}
a{color:#256abf}a:hover{color:#104281}
.card{background:#fcfcfb;border:1px solid #e2e0da;border-radius:14px;padding:20px;box-sizing:border-box;min-width:0}
.h2{font-size:17px;font-weight:700;margin:0}
.muted{color:#52514e}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#f0efec;font-size:13px;color:#0b0b0b;white-space:nowrap}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #c9c7bf;background:#fcfcfb;color:#0b0b0b;font:inherit;font-size:14px;cursor:pointer}
.btn:hover{filter:brightness(0.96)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.pii{background:#fde7c3;border-bottom:2px solid #c77700;border-radius:3px;padding:0 2px}
.tok{background:#cde2fb;color:#0d366b;border-radius:3px;padding:0 2px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:#52514e;padding:10px 12px;border-bottom:1px solid #e2e0da;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #eeece6;vertical-align:top}
textarea,input{font:inherit}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">

<!-- ===================== 登入 ===================== -->
<sc-if value="{{isLogin}}" hint-placeholder-val="{{ true }}">
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
    <div class="card" style="width: 420px; max-width: 100%; display: flex; flex-direction: column; gap: 16px; padding: 32px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div aria-hidden="true" style="width: 44px; height: 44px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"></path><path d="M12 8l1.2 2.6L16 12l-2.8 1.4L12 16l-1.2-2.6L8 12l2.8-1.4z"></path></svg>
        </div>
        <div>
          <h1 style="margin: 0; font-size: 22px">永豐AI精靈</h1>
          <div class="small muted">員工 AI 行為治理系統</div>
        </div>
      </div>
      <label for="emp-id" style="font-weight: 500">工號</label>
      <input id="emp-id" value="{{empInput}}" onChange="{{onEmp}}" placeholder="例如 S12345" autocomplete="username" style="min-height: 48px; padding: 0 14px; border: 1px solid #c9c7bf; border-radius: 10px; font-size: 16px; background: #ffffff">
      <sc-if value="{{hasLoginErr}}" hint-placeholder-val="{{ false }}">
        <div class="small" role="alert" style="color: #a12b2b">查無此工號，請再確認。</div>
      </sc-if>
      <button class="btn" onClick="{{doLogin}}" style="background: {{accent}}; border-color: {{accent}}; color: #ffffff; font-weight: 500">以工號登入</button>
      <div class="small muted" style="line-height: 1.7">正式版以行內單一登入（SSO）驗證工號。原型可點選示範帳號：</div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{demoAccounts}}" as="da" hint-placeholder-count="2">
          <button class="btn" onClick="{{da.fill}}" style="text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span class="mono">{{da.id}}</span><span class="small muted">{{da.desc}}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </div>
</sc-if>

<!-- ===================== 主系統 ===================== -->
<sc-if value="{{isApp}}" hint-placeholder-val="{{ false }}">
<div style="max-width: 1280px; margin: 0 auto; padding: 24px 20px 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div aria-hidden="true" style="width: 44px; height: 44px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6l7-3z"></path><path d="M12 8l1.2 2.6L16 12l-2.8 1.4L12 16l-1.2-2.6L8 12l2.8-1.4z"></path></svg>
      </div>
      <div>
        <h1 style="margin: 0; font-size: 22px">永豐AI精靈</h1>
        <div class="small muted">{{modeSubtitle}}</div>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
      <span class="chip" style="background: #fff4d6; color: #6b4a00">原型示意・資料皆為虛構</span>
      <span class="chip"><span class="mono">{{me.id}}</span>{{me.name}}・{{me.title}}</span>
      <sc-if value="{{me.isAdmin}}" hint-placeholder-val="{{ false }}">
        <div role="group" aria-label="切換身分" style="display: inline-flex; border: 1px solid #c9c7bf; border-radius: 10px; overflow: hidden">
          <button onClick="{{toUser}}" aria-pressed="{{userPressed}}" style="min-height: 44px; padding: 0 14px; border: none; font: inherit; font-size: 14px; cursor: pointer; background: {{userBtnBg}}; color: {{userBtnFg}}">使用者</button>
          <button onClick="{{toAdmin}}" aria-pressed="{{adminPressed}}" style="min-height: 44px; padding: 0 14px; border: none; font: inherit; font-size: 14px; cursor: pointer; background: {{adminBtnBg}}; color: {{adminBtnFg}}">管理員</button>
        </div>
      </sc-if>
      <sc-if value="{{isUserMode}}" hint-placeholder-val="{{ true }}">
        <button class="btn" onClick="{{toggleDash}}">{{dashToggleLabel}}</button>
      </sc-if>
      <button class="btn" onClick="{{logout}}">登出</button>
    </div>
  </header>

  <sc-if value="{{isUserMode}}" hint-placeholder-val="{{ true }}">
    <section aria-label="示範風險分級" style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 12px; background: #fcfcfb; border: 1px dashed #c9c7bf">
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline">
        <span style="font-weight: 500">示範：不同風險等級，精靈的反應不同</span>
        <span class="small muted">只有第 3、4 級會跳出通知，其餘只記錄</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{tierDemos}}" as="td" hint-placeholder-count="4">
          <button class="btn" onClick="{{td.pick}}" style="display: inline-flex; align-items: center; gap: 8px"><span class="dot" style="background: {{td.color}}"></span>{{td.label}}</button>
        </sc-for>
      </div>
      <sc-if value="{{hasDemoNote}}" hint-placeholder-val="{{ false }}">
        <div class="small" role="status" style="padding: 8px 12px; border-radius: 8px; background: #f0efec">{{demoNote}}</div>
      </sc-if>
    </section>
  </sc-if>

  <!-- 隱藏 dashboard 時的日常工作畫面 -->
  <sc-if value="{{showWork}}" hint-placeholder-val="{{ false }}">
    <section class="card" style="display: flex; flex-direction: column; gap: 14px; min-height: 420px">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap">
        <h2 class="h2">行內 GAI 助理（模擬日常工作畫面）</h2>
        <span class="small muted">Dashboard 已隱藏，精靈仍在右下角</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; max-width: 720px">
        <div style="align-self: flex-end; background: #e8f1fc; padding: 12px 14px; border-radius: 12px; line-height: 1.7">請幫我把這封客戶來函整理成三點摘要，並草擬回覆。</div>
        <div style="align-self: flex-start; background: #f0efec; padding: 12px 14px; border-radius: 12px; line-height: 1.7">已整理如下：一、【姓名1】詢問帳戶限制原因；二、希望了解解除條件；三、要求書面回覆。回覆草稿已產生，請確認後使用。</div>
      </div>
      <div class="small muted" style="margin-top: auto">試試上方的示範按鈕，或點右下角精靈。需要時再開啟 Dashboard。</div>
    </section>
  </sc-if>

  <sc-if value="{{showDash}}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; flex-direction: column; gap: 18px">
    <nav aria-label="功能分頁" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button class="btn" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="background: {{t.bg}}; color: {{t.fg}}; border-color: {{t.bd}}; font-weight: 500">{{t.label}}</button>
      </sc-for>
    </nav>

    <!-- ========== 使用者：總覽 ========== -->
    <sc-if value="{{isOverview}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
          <sc-for list="{{userKpis}}" as="k" hint-placeholder-count="4">
            <div class="card" style="display: flex; flex-direction: column; gap: 6px">
              <div class="muted small">{{k.label}}</div>
              <div style="font-size: 32px; font-weight: 700; line-height: 1.1">{{k.value}}</div>
              <div class="muted small">{{k.note}}</div>
            </div>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px">
          <section class="card" style="display: flex; flex-direction: column; gap: 14px">
            <div>
              <h2 class="h2">Token 用量追蹤</h2>
              <div class="muted small" style="margin-top: 4px">本月 182,400 / 配額 300,000 tokens</div>
            </div>
            <div aria-label="本月配額使用 61%" style="height: 14px; background: #f0efec; border-radius: 4px">
              <div style="height: 14px; width: 61%; background: #2a78d6; border-radius: 4px"></div>
            </div>
            <div class="small muted">已用 61%，依目前速度月底約用到 88%</div>
            <div class="small" style="padding: 8px 12px; border-radius: 8px; background: #f0efec">用途：成本管理與異常偵測，不作為績效考核依據。</div>
            <div style="display: flex; flex-direction: column; gap: 10px">
              <sc-for list="{{myTokenBars}}" as="b" hint-placeholder-count="4">
                <div title="{{b.tip}}" style="display: grid; grid-template-columns: 150px minmax(0, 1fr) 72px; gap: 10px; align-items: center">
                  <div class="small">{{b.label}}</div>
                  <div style="height: 12px; background: #f0efec; border-radius: 0 4px 4px 0"><div style="height: 12px; width: {{b.pct}}; background: #2a78d6; border-radius: 0 4px 4px 0"></div></div>
                  <div class="small mono" style="text-align: right">{{b.value}}</div>
                </div>
              </sc-for>
            </div>
          </section>
          <section class="card" style="display: flex; flex-direction: column; gap: 12px">
            <h2 class="h2">風險分級說明與本週分布</h2>
            <sc-for list="{{tierRows}}" as="tr" hint-placeholder-count="4">
              <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #f6f5f1">
                <div>
                  <div style="display: flex; align-items: center; gap: 8px; font-weight: 500"><span class="dot" style="background: {{tr.color}}"></span>{{tr.label}}</div>
                  <div class="small muted" style="margin-top: 2px">{{tr.handling}}</div>
                  <div class="small" style="margin-top: 2px">例：{{tr.example}}</div>
                </div>
                <div class="mono" style="font-weight: 500">{{tr.mine}} 次</div>
              </div>
            </sc-for>
            <div class="small muted" style="line-height: 1.6">分級架構參考歐盟《人工智慧法》的四級風險分類，並依金管會《金融業運用 AI 指引》的風險基礎方法，改為以「員工的 AI 行為」為對象分級。</div>
          </section>
        </div>
        <section class="card" style="display: flex; flex-direction: column; gap: 12px">
          <h2 class="h2">最近的 AI 行動</h2>
          <div style="overflow-x: auto">
            <table class="tbl">
              <thead><tr><th>時間</th><th>風險等級</th><th>發起者</th><th>工具</th><th>任務</th><th>Token</th></tr></thead>
              <tbody>
                <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
                  <tr><td class="mono">{{r.time}}</td><td><span class="chip"><span class="dot" style="background: {{r.tierColor}}"></span>{{r.tierShort}}</span></td><td>{{r.originLabel}}</td><td>{{r.tool}}</td><td>{{r.task}}</td><td class="mono">{{r.tokensFmt}}</td></tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </sc-if>

    <!-- ========== 使用者：去識別化 ========== -->
    <sc-if value="{{isDeid}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <section class="card" style="display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end">
            <div>
              <h2 class="h2">貼上要交給 AI 的內容</h2>
              <div class="muted small" style="margin-top: 4px">試著修改下方文字，系統會即時偵測敏感資料</div>
            </div>
            <div style="display: flex; gap: 8px">
              <button class="btn" onClick="{{useSample}}">使用範例</button>
              <button class="btn" onClick="{{clearInput}}">清空</button>
            </div>
          </div>
          <label for="deid-input" class="small muted">輸入內容</label>
          <textarea id="deid-input" value="{{input}}" onChange="{{onInput}}" rows="6" style="width: 100%; box-sizing: border-box; padding: 14px; border: 1px solid #c9c7bf; border-radius: 10px; background: #ffffff; font-size: 15px; line-height: 1.7; resize: vertical"></textarea>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
            <span class="small muted">偵測到：</span>
            <sc-for list="{{piiChips}}" as="c" hint-placeholder-count="4">
              <span class="chip"><span class="pii">{{c.label}}</span> × {{c.count}}</span>
            </sc-for>
            <sc-if value="{{noPii}}" hint-placeholder-val="{{ false }}"><span class="chip">未偵測到敏感資料</span></sc-if>
          </div>
        </section>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px">
          <section class="card" style="display: flex; flex-direction: column; gap: 10px">
            <h2 class="h2">① 原文標記</h2>
            <div class="muted small">黃色為偵測到的個人資料，滑鼠移上可看類型</div>
            <div style="white-space: pre-wrap; line-height: 1.9; font-size: 15px"><sc-for list="{{origSegs}}" as="s" hint-placeholder-count="3"><sc-if value="{{s.hit}}" hint-placeholder-val="{{ false }}"><span class="pii" title="{{s.tip}}">{{s.text}}</span></sc-if><sc-if value="{{s.plain}}" hint-placeholder-val="{{ true }}"><span>{{s.text}}</span></sc-if></sc-for></div>
          </section>
          <section class="card" style="display: flex; flex-direction: column; gap: 10px">
            <h2 class="h2">② 實際送給 AI 的內容</h2>
            <div class="muted small">個資換成代碼，對應表只存在你的電腦，不會送出</div>
            <div style="white-space: pre-wrap; line-height: 1.9; font-size: 15px"><sc-for list="{{maskedSegs}}" as="s" hint-placeholder-count="3"><sc-if value="{{s.hit}}" hint-placeholder-val="{{ false }}"><span class="tok" title="{{s.tip}}">{{s.text}}</span></sc-if><sc-if value="{{s.plain}}" hint-placeholder-val="{{ true }}"><span>{{s.text}}</span></sc-if></sc-for></div>
          </section>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px">
          <section class="card" style="display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center">
              <h2 class="h2">③ AI 回覆</h2>
              <button class="btn" onClick="{{toggleRestore}}" aria-pressed="{{restoredStr}}">{{restoreLabel}}</button>
            </div>
            <div class="muted small">{{restoreHint}}</div>
            <div style="white-space: pre-wrap; line-height: 1.9; font-size: 15px; background: #ffffff; border: 1px solid #e2e0da; border-radius: 10px; padding: 14px"><sc-for list="{{replySegs}}" as="s" hint-placeholder-count="3"><sc-if value="{{s.hit}}" hint-placeholder-val="{{ false }}"><span class="{{s.cls}}">{{s.text}}</span></sc-if><sc-if value="{{s.plain}}" hint-placeholder-val="{{ true }}"><span>{{s.text}}</span></sc-if></sc-for></div>
          </section>
          <section class="card" style="display: flex; flex-direction: column; gap: 12px">
            <h2 class="h2">風險等級與工具建議</h2>
            <div style="display: flex; align-items: center; gap: 10px">
              <span class="dot" style="background: {{level.color}}; width: 14px; height: 14px"></span>
              <span style="font-size: 20px; font-weight: 700">{{level.label}}</span>
            </div>
            <div class="small" style="line-height: 1.7">{{level.reason}}</div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <sc-for list="{{level.routes}}" as="rt" hint-placeholder-count="3">
                <div style="display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: #f6f5f1">
                  <span class="dot" style="background: {{rt.color}}"></span>
                  <span style="font-weight: 500; min-width: 72px">{{rt.verdict}}</span>
                  <span class="small">{{rt.tool}}</span>
                </div>
              </sc-for>
            </div>
          </section>
        </div>
      </div>
    </sc-if>

    <!-- ========== 使用者：Agent 行為翻譯 ========== -->
    <sc-if value="{{isAgent}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <section class="card" style="display: flex; flex-direction: column; gap: 14px">
          <div>
            <h2 class="h2">任務：家事宣告名單查找</h2>
            <div class="muted small" style="margin-top: 4px">你按下執行：「查找本週司法院公告的監護、輔助宣告名單，比對本行客戶並更新帳戶狀態」，以下是 AI 實際做的每一步</div>
          </div>
          <div aria-label="資料流向" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
            <span class="small muted">資料流向：</span>
            <sc-for list="{{flow}}" as="f" hint-placeholder-count="5">
              <span style="display: inline-flex; align-items: center; gap: 8px">
                <span class="chip" style="background: {{f.bg}}; color: {{f.fg}}; font-weight: 500">{{f.label}}</span>
                <sc-if value="{{f.arrow}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" class="muted">→</span></sc-if>
              </span>
            </sc-for>
          </div>
          <div class="small" style="display: flex; flex-wrap: wrap; gap: 16px">
            <span class="muted">橘色框為本行以外的資料來源</span>
            <span>本任務共使用 <span class="mono">23,190</span> tokens</span>
          </div>
        </section>
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px">
          <sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
            <li class="card" style="display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16px; border-color: {{st.border}}">
              <div class="mono" style="width: 44px; height: 44px; border-radius: 50%; background: #f0efec; display: flex; align-items: center; justify-content: center; font-weight: 700">{{st.n}}</div>
              <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
                <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center">
                  <div style="font-weight: 700; font-size: 16px">{{st.title}}</div>
                  <div style="display: flex; flex-wrap: wrap; gap: 8px">
                    <span class="chip"><span class="dot" style="background: {{st.tierColor}}"></span>{{st.tierLabel}}</span>
                    <span class="chip mono">{{st.tokens}} tokens</span>
                    <span class="chip">{{st.status}}</span>
                  </div>
                </div>
                <div style="line-height: 1.7"><span class="muted small">白話說明：</span>{{st.plain}}</div>
                <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
                  <span class="small muted">用到的技術：</span>
                  <sc-for list="{{st.tags}}" as="tg" hint-placeholder-count="2"><span class="chip mono" style="background: #e8f1fc; color: #104281">{{tg}}</span></sc-for>
                </div>
                <div class="small" style="display: flex; flex-wrap: wrap; gap: 16px">
                  <span><span class="muted">執行位置：</span>{{st.where}}</span>
                  <span><span class="muted">處理資料：</span>{{st.data}}</span>
                </div>

<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(o) {
    this.state = Object.assign({}, this.state, o);
    if (!this._queued) { this._queued = true; queueMicrotask(() => { this._queued = false; this._render(); }); }
  }
}

const DC = (() => {
  function parseAttrs(s) {
    const out = {};
    s.replace(/([\w-]+)="([^"]*)"/g, (_, k, v) => { out[k] = v.replace(/^\{\{\s*|\s*\}\}$/g, ''); });
    return out;
  }
  function parse(src) {
    const root = { type: 'root', children: [] }, stack = [root];
    const re = /<sc-(if|for)\b([^>]*)>|<\/sc-(if|for)>/g;
    let last = 0, m;
    while ((m = re.exec(src))) {
      const top = stack[stack.length - 1];
      if (m.index > last) top.children.push({ type: 'text', text: src.slice(last, m.index) });
      if (m[1]) { const n = { type: m[1], attrs: parseAttrs(m[2]), children: [] }; top.children.push(n); stack.push(n); }
      else stack.pop();
      last = re.lastIndex;
    }
    if (last < src.length) root.children.push({ type: 'text', text: src.slice(last) });
    return root;
  }
  function lookup(path, scope) {
    return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
  }
  function esc(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function renderText(t, scope, handlers) {
    t = t.replace(/\son(Click|Change)="\{\{\s*([\w.]+)\s*\}\}"/g, (_, ev, p) => {
      handlers.push(lookup(p, scope));
      return ' data-on-' + ev.toLowerCase() + '="' + (handlers.length - 1) + '"';
    });
    t = t.replace(/\schecked="\{\{\s*([\w.]+)\s*\}\}"/g, (_, p) => (lookup(p, scope) ? ' checked' : ''));
    return t.replace(/\{\{\s*([\w.]+)\s*\}\}/g, (_, p) => esc(lookup(p, scope)));
  }
  function render(node, scope, handlers) {
    if (node.type === 'text') return renderText(node.text, scope, handlers);
    const kids = (sc) => node.children.map((c) => render(c, sc, handlers)).join('');
    if (node.type === 'if') return lookup(node.attrs.value, scope) ? kids(scope) : '';
    if (node.type === 'for') {
      const list = lookup(node.attrs.list, scope) || [];
      return list.map((item) => { const sc = Object.create(scope); sc[node.attrs.as] = item; return kids(sc); }).join('');
    }
    return kids(scope);
  }
  function mount(Cls) {
    const app = document.getElementById('app');
    const tpl = parse(document.getElementById('tpl').textContent);
    const inst = new Cls({});
    let handlers = [];
    inst._render = () => {
      handlers = [];
      let html = render(tpl, inst.renderVals(), handlers);
      // textarea 的 value 要放在內容裡
      html = html.replace(/<textarea([^>]*?)\svalue="([^"]*)"([^>]*)><\/textarea>/g, '<textarea$1$3>$2</textarea>');
      const a = document.activeElement, id = a && a.id;
      const sel = id && 'selectionStart' in a ? [a.selectionStart, a.selectionEnd] : null;
      app.innerHTML = html;
      if (id) {
        const el = document.getElementById(id);
        if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
      }
    };
    const fire = (el, attr, e) => { const h = handlers[+el.getAttribute(attr)]; if (typeof h === 'function') h(e); };
    app.addEventListener('click', (e) => { const el = e.target.closest('[data-on-click]'); if (el) fire(el, 'data-on-click', e); });
    app.addEventListener('input', (e) => { const el = e.target; if (el.type !== 'checkbox' && el.hasAttribute('data-on-change')) fire(el, 'data-on-change', e); });
    app.addEventListener('change', (e) => { const el = e.target; if (el.type === 'checkbox' && el.hasAttribute('data-on-change')) fire(el, 'data-on-change', e); });
    inst._render();
    window.__dc = inst;
  }
  return { mount };
})();
</script>
